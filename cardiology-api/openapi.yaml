openapi: 3.1.0
info:
  title: HLS Cardiology Read API
  version: 2.0.0
  license:
    name: MIT
    identifier: MIT
  summary: Read-only cardiology subject, observation, and metric contract over the HLS data estate.
  description: |
    Consumed by the private caldova-cardio-e2e agent platform through its
    CohortStore read port. This API is READ-ONLY by design: approvals, runs,
    settings, dispatch outboxes, and receipts are commands owned by the app's
    transactional store, never by the analytical estate.

    Sources:
      - Subject identity, conditions, and point observations: HDS Silver
        projections of FHIR Patient / Condition / Observation.
      - Device association: FHIR Device + DeviceAssociation (HDS Silver).
      - Device windows: Eventhouse (synthetic cardiac-device feed).
      - Pulse rate and SpO2 (Masimo pulse oximetry): the live reading is the
        latest Eventhouse TelemetryRaw row for the subject's associated Masimo
        device (the active, unambiguous FHIR Basic device-assoc link). The
        estate's masimo-fhir-aggregator writes every completed UTC 5-minute
        window per device and measure into FHIR as one Observation: the mean
        of the window's readings, tagged masimo-telemetry-aggregate
        (https://brakekat.com/hls/tags), with effectivePeriod {start, end},
        Observation.device and meta.source set. It reaches reporting Gold
        through the normal FHIR $export path, where it is ordered by the end
        of its window (effectiveAt = effectivePeriod.end).
      - Metrics: reporting Gold, one governed definition per metric.

    Identifiers: subjectId is the FHIR Patient logical id; deviceId is the
    FHIR Device logical id. No separate cardiology identifier scheme exists.

    Measures, codes, units, and staleness limits come from
    measure-catalog.json in this directory. A measure with no observation is
    reported as missing, never defaulted or simulated.

    SYNTHETIC DATA ONLY. No PHI security, privacy, retention, or compliance
    design exists for this deployment.
servers:
  - url: /
security:
  - entra: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Per-source freshness. Callers label views stale from this, not from guesses.
      responses:
        "200":
          description: Source freshness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/subjects:
    get:
      operationId: listSubjects
      summary: Active subjects, optionally filtered by care setting.
      description: Backs CohortStore.listActive and CohortStore.listByCareSetting.
      parameters:
        - name: careSetting
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CareSetting" }
      responses:
        "200":
          description: Active subjects.
          content:
            application/json:
              schema:
                type: object
                required: [dataClassification, catalogVersion, subjects]
                properties:
                  dataClassification: { $ref: "#/components/schemas/DataClassification" }
                  catalogVersion: { type: string }
                  subjects:
                    type: array
                    items: { $ref: "#/components/schemas/Subject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/subjects/{subjectId}:
    get:
      operationId: getSubject
      summary: One subject with latest value per catalog measure.
      description: Backs CohortStore.getById. Unknown ids return 404; nothing is fabricated.
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Subject.
          content:
            application/json:
              schema:
                type: object
                required: [dataClassification, catalogVersion, subject]
                properties:
                  dataClassification: { $ref: "#/components/schemas/DataClassification" }
                  catalogVersion: { type: string }
                  subject: { $ref: "#/components/schemas/Subject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/subjects/{subjectId}/observations:
    get:
      operationId: listObservations
      summary: Time-ordered observations for one catalog measure.
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - name: measure
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MeasureKey" }
        - name: since
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
      responses:
        "200":
          description: |
            Observations, oldest first. Every item's `measure` equals the
            top-level `measure` (the requested key); each item is bound to that
            measure's catalog code and unit by its schema.
          content:
            application/json:
              schema:
                type: object
                required: [dataClassification, measure, observations, truncated]
                properties:
                  dataClassification: { $ref: "#/components/schemas/DataClassification" }
                  measure: { $ref: "#/components/schemas/MeasureKey" }
                  observations:
                    type: array
                    items: { $ref: "#/components/schemas/AnyObservation" }
                  truncated:
                    type: boolean
                    description: True when more rows matched than limit.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/metrics/{metricId}:
    get:
      operationId: getMetric
      summary: One governed Gold metric value with its definition.
      parameters:
        - name: metricId
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,63}$" }
        - name: periodStart
          in: query
          required: true
          schema: { type: string, format: date }
        - name: periodEnd
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Metric value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    entra:
      type: oauth2
      description: |
        Microsoft Entra ID, brakekat tenant. Callers are services (the app
        platform's managed identity) using the client-credentials grant, which
        requests the resource's `/.default` scope. Authorization is by app
        role: the access token's `roles` claim must contain `Cardiology.Read`;
        a valid token without it receives 403. `Cardiology.Read` is an app
        role, not an OAuth scope, so it does not appear in security requirements.
        Application ID URI: api://hls-cardiology-read (registered with the API
        implementation).
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/8d038e6a-9b7d-4cb8-bbcf-e84dff156478/oauth2/v2.0/token
          scopes:
            api://hls-cardiology-read/.default: All app roles assigned to the calling service principal.
  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      description: FHIR Patient logical id.
      schema: { type: string, pattern: "^[A-Za-z0-9\\-.]{1,64}$" }
  responses:
    BadRequest:
      description: Invalid parameters.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Token is valid but its roles claim lacks Cardiology.Read.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Unknown subject or metric.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    DataClassification:
      type: string
      const: synthetic
    CareSetting:
      type: string
      enum: [inpatient, outpatient, home-monitored]
    MeasureKey:
      type: string
      description: Key from measure-catalog.json; equals the platform scorer's MeasureSpec.key.
      enum: [lactate, map, pulseRate, spo2, deviceFlow]
    Coding:
      type: object
      required: [system, code]
      properties:
        system: { type: string, format: uri }
        code: { type: string }
        display: { type: string }
    Provenance:
      type: object
      required: [sourceSystem, sourceRecordId, ingestedAt]
      properties:
        sourceSystem:
          type: string
          enum: [hds-silver, eventhouse, reporting-gold]
        sourceRecordId:
          type: string
          description: FHIR resource reference (e.g. Observation/abc) or Eventhouse row key.
        ingestedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Coding" }
          description: Carries FHIR meta.tag, including the synthetic-demo provenance tag.
    ObservationBase:
      type: object
      required: [value, effectiveAt, provenance]
      properties:
        value: { type: number }
        effectiveAt: { type: string, format: date-time }
        provenance: { $ref: "#/components/schemas/Provenance" }
    LactateObservation:
      allOf: [{ $ref: "#/components/schemas/ObservationBase" }]
      type: object
      required: [measure, code, unit]
      properties:
        measure: { const: lactate }
        code:
          type: object
          required: [system, code]
          properties: { system: { const: "http://loinc.org" }, code: { const: "2524-7" }, display: { type: string } }
        unit: { const: mmol/L }
    MapObservation:
      allOf: [{ $ref: "#/components/schemas/ObservationBase" }]
      type: object
      required: [measure, code, unit]
      properties:
        measure: { const: map }
        code:
          type: object
          required: [system, code]
          properties: { system: { const: "http://loinc.org" }, code: { const: "8478-0" }, display: { type: string } }
        unit: { const: "mm[Hg]" }
    PulseRateObservation:
      allOf: [{ $ref: "#/components/schemas/ObservationBase" }]
      type: object
      required: [measure, code, unit]
      properties:
        measure: { const: pulseRate }
        code:
          type: object
          required: [system, code]
          properties: { system: { const: "http://loinc.org" }, code: { const: "8889-8" }, display: { type: string } }
        unit: { const: /min }
    Spo2Observation:
      allOf: [{ $ref: "#/components/schemas/ObservationBase" }]
      type: object
      required: [measure, code, unit]
      properties:
        measure: { const: spo2 }
        code:
          type: object
          required: [system, code]
          properties: { system: { const: "http://loinc.org" }, code: { const: "59408-5" }, display: { type: string } }
        unit: { const: "%" }
    DeviceFlowObservation:
      allOf: [{ $ref: "#/components/schemas/ObservationBase" }]
      type: object
      required: [measure, code, unit]
      properties:
        measure: { const: deviceFlow }
        code:
          type: object
          required: [system, code]
          properties: { system: { const: "https://brakekat.com/hls/cardiology/measures" }, code: { const: device-flow-index }, display: { type: string } }
        unit: { const: "%" }
    AnyObservation:
      oneOf:
        - $ref: "#/components/schemas/LactateObservation"
        - $ref: "#/components/schemas/MapObservation"
        - $ref: "#/components/schemas/PulseRateObservation"
        - $ref: "#/components/schemas/Spo2Observation"
        - $ref: "#/components/schemas/DeviceFlowObservation"
    MissingMeasure:
      type: object
      required: [status]
      properties:
        status: { const: missing }
      additionalProperties: false
    Staleness:
      type: boolean
      description: effectiveAt is older than the catalog maxAgeSeconds for this measure.
    LatestLactate:
      oneOf:
        - { type: object, required: [status, observation, stale], properties: { status: { const: present }, observation: { $ref: "#/components/schemas/LactateObservation" }, stale: { $ref: "#/components/schemas/Staleness" } } }
        - $ref: "#/components/schemas/MissingMeasure"
    LatestMap:
      oneOf:
        - { type: object, required: [status, observation, stale], properties: { status: { const: present }, observation: { $ref: "#/components/schemas/MapObservation" }, stale: { $ref: "#/components/schemas/Staleness" } } }
        - $ref: "#/components/schemas/MissingMeasure"
    LatestPulseRate:
      oneOf:
        - { type: object, required: [status, observation, stale], properties: { status: { const: present }, observation: { $ref: "#/components/schemas/PulseRateObservation" }, stale: { $ref: "#/components/schemas/Staleness" } } }
        - $ref: "#/components/schemas/MissingMeasure"
    LatestSpo2:
      oneOf:
        - { type: object, required: [status, observation, stale], properties: { status: { const: present }, observation: { $ref: "#/components/schemas/Spo2Observation" }, stale: { $ref: "#/components/schemas/Staleness" } } }
        - $ref: "#/components/schemas/MissingMeasure"
    LatestDeviceFlow:
      oneOf:
        - { type: object, required: [status, observation, stale], properties: { status: { const: present }, observation: { $ref: "#/components/schemas/DeviceFlowObservation" }, stale: { $ref: "#/components/schemas/Staleness" } } }
        - $ref: "#/components/schemas/MissingMeasure"
    Device:
      type: object
      required: [deviceId, kind, serial, associatedSince, lastEventAt]
      properties:
        deviceId: { type: string, description: FHIR Device logical id. }
        kind: { type: string }
        serial: { type: string }
        associatedSince: { type: string, format: date-time }
        lastEventAt:
          type: [string, "null"]
          format: date-time
          description: Latest Eventhouse event for this device; null when never seen.
    Subject:
      type: object
      description: |
        Total mapping to the platform CohortRecord (no value is ever substituted):
          id               = subjectId
          initials         = initials
          ageBand          = ageBand
          careSetting      = careSetting
          primaryCondition = primaryCondition.display
          device           = device ? { kind: device.kind, serial: device.serial } : undefined
          attendingRole    = attendingRole            (may be null)
          observations[k]  = latest[k].observation.value when status=present and stale=false, else null
                             (pulseRate and spo2: latest[k] is the later of the Eventhouse live
                             reading and the latest 5-minute FHIR aggregate, by effectiveAt,
                             which for an aggregate is its window end)
          observedAt       = observedAt               (may be null)
        CohortRecord.attendingRole and observedAt are non-null strings today; the
        platform read adapter must widen both to string | null rather than
        invent an attending role or a timestamp.
      required: [subjectId, initials, ageBand, careSetting, primaryCondition, attendingRole, device, latest, observedAt]
      properties:
        subjectId: { type: string }
        initials: { type: string, pattern: "^[A-Z]\\.[A-Z]\\.$" }
        ageBand: { type: string, examples: ["60-69"] }
        careSetting: { $ref: "#/components/schemas/CareSetting" }
        primaryCondition:
          type: object
          required: [system, code, display]
          properties:
            system: { type: string, format: uri }
            code: { type: string }
            display: { type: string, minLength: 1 }
        attendingRole:
          type: [string, "null"]
          description: From CareTeam/PractitionerRole; null when unassigned.
        device:
          description: |
            The single active cardiac-device association. Version 1 permits at
            most one; the projection's row gate rejects a subject with more than
            one rather than choosing silently. null when no device is associated.
          oneOf:
            - $ref: "#/components/schemas/Device"
            - type: "null"
        observedAt:
          type: [string, "null"]
          format: date-time
          description: Latest effectiveAt across present measures; null when every measure is missing.
        latest:
          type: object
          description: One entry per catalog measure key, each bound to that measure's code and unit.
          required: [lactate, map, pulseRate, spo2, deviceFlow]
          properties:
            lactate: { $ref: "#/components/schemas/LatestLactate" }
            map: { $ref: "#/components/schemas/LatestMap" }
            pulseRate: { $ref: "#/components/schemas/LatestPulseRate" }
            spo2: { $ref: "#/components/schemas/LatestSpo2" }
            deviceFlow: { $ref: "#/components/schemas/LatestDeviceFlow" }
          additionalProperties: false
    SourceFreshness:
      type: object
      required: [source, status]
      properties:
        source:
          type: string
          enum: [hds-silver, eventhouse, reporting-gold]
        status:
          type: string
          enum: [fresh, stale, unavailable]
        latestAt: { type: [string, "null"], format: date-time }
    Health:
      type: object
      required: [dataClassification, catalogVersion, sources]
      properties:
        dataClassification: { $ref: "#/components/schemas/DataClassification" }
        catalogVersion: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceFreshness" }
    MetricDefinition:
      type: object
      required: [metricId, version, numerator, denominator, exclusions, source]
      properties:
        metricId: { type: string }
        version: { type: string }
        numerator: { type: string }
        denominator: { type: string }
        exclusions: { type: string }
        source: { type: string, description: Gold table(s) the metric is computed from. }
    MetricValue:
      type: object
      required: [dataClassification, definition, periodStart, periodEnd, numerator, denominator, computedAt]
      properties:
        dataClassification: { $ref: "#/components/schemas/DataClassification" }
        definition: { $ref: "#/components/schemas/MetricDefinition" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        numerator: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        rate:
          type: [number, "null"]
          description: numerator/denominator; null when denominator is 0.
        computedAt: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
